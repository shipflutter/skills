<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- =====================================================================
       Universal "get the app" link. Auto-detects the OS and forwards to the
       right store BEFORE paint, so phone visitors never see the chooser flash.
       iOS -> App Store, Android -> Google Play, desktop/other -> chooser below.
       Escape hatch: ?stay=1 (or ?noredirect) keeps the chooser (for QA).
       Replace every __PLACEHOLDER__ before shipping.
       ===================================================================== -->
  <script>
    (function () {
      try {
        var p = new URLSearchParams(location.search);
        if (p.has("stay") || p.has("noredirect")) return;
        var ua = navigator.userAgent || "";
        var isAndroid = /Android/i.test(ua);
        var isIOS =
          /iPad|iPhone|iPod/i.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var PLAY = "__ANDROID_URL__";
        var APP_STORE = "__IOS_URL__";
        // location.replace keeps this interstitial out of history so Back won't trap.
        if (isAndroid) location.replace(PLAY);
        else if (isIOS) location.replace(APP_STORE);
      } catch (e) {}
    })();
  </script>
  <meta name="theme-color" content="#0e0e10" />
  <meta name="robots" content="noindex,follow" />
  <title>Get __APP_NAME__</title>
  <meta name="description" content="Download __APP_NAME__ — one link, opens the right store automatically on iOS and Android." />
  <link rel="canonical" href="__GET_URL__" />
  <link rel="icon" type="image/png" href="__APP_ICON__" />
  <link rel="apple-touch-icon" href="__APP_ICON__" />
  <style>
    :root { --bg:#fff; --fg:#1a1a1a; --sub:#6e6e6e; --bd:#e5e7eb; --btn:#1a1a1a; --btnfg:#fff; --r:12px;
      --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    @media (prefers-color-scheme:dark){ :root{ --bg:#0e0e10; --fg:#fff; --sub:#9ca3af; --bd:#28282c; --btn:#fff; --btnfg:#0e0e10; } }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--fg); font-family:var(--font); }
    .get { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 20px; }
    .get-card { width:100%; max-width:380px; text-align:center; }
    .get-icon { width:84px; height:84px; border-radius:20px; box-shadow:0 4px 16px rgba(0,0,0,.18); display:block; margin:0 auto 20px; }
    .get-card h1 { font-size:28px; margin:0 0 6px; }
    .get-sub { color:var(--sub); margin:0 0 28px; font-size:16px; }
    .get-btns { display:flex; flex-direction:column; gap:12px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:10px; width:100%;
      background:var(--btn); color:var(--btnfg); border-radius:var(--r); padding:14px 18px;
      font-weight:700; font-size:16px; text-decoration:none; }
    .btn:active { opacity:.9; }
    .btn svg { width:20px; height:20px; }
    .get-alt { margin:22px 0 0; font-size:15px; }
    .get-alt a { color:var(--fg); font-weight:600; text-decoration:underline; text-underline-offset:3px; }
    .get-note { margin:18px 0 0; font-size:12px; color:var(--sub); }
  </style>
</head>
<body>
  <main class="get">
    <div class="get-card">
      <img class="get-icon" src="__APP_ICON__" alt="__APP_NAME__" width="84" height="84" />
      <h1>Get __APP_NAME__</h1>
      <p class="get-sub">__APP_TAGLINE__</p>
      <div class="get-btns">
        <a class="btn" href="__IOS_URL__" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.5 1.5c.1 1-.3 2-.9 2.8-.7.8-1.7 1.4-2.7 1.3-.1-1 .4-2 1-2.7.6-.8 1.7-1.4 2.6-1.4zM19 17.3c-.5 1.2-.8 1.7-1.4 2.7-.9 1.4-2.2 3.1-3.8 3.1-1.4 0-1.8-.9-3.7-.9s-2.3.9-3.7.9c-1.6 0-2.8-1.6-3.7-3-2.5-3.9-2.8-8.5-1.2-11 1.1-1.7 2.8-2.7 4.4-2.7 1.6 0 2.7 1 4 1 1.3 0 2-1 4-1 1.4 0 3 .8 4 2.2-3.6 2-3 7.1.8 8.7z"/></svg>
          Download on the App Store
        </a>
        <a class="btn" href="__ANDROID_URL__" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 2.2c-.3.3-.5.7-.5 1.3v17c0 .6.2 1 .5 1.3l.1.1L13 13.1v-.2L3.7 2.1zm10.7 11.4 3 3 .1-.1c1.5-.8 1.5-.8 1.5-1.6s0-.8-1.5-1.6l-.1-.1-3 .4zm-.7-.5L4.3 2.5l8.5 4.9 1.8 1.8-1 1zm-9.3 9.4 9.3-9.4 1 1-1.8 1.8L4.3 21.5z"/></svg>
          Get it on Google Play
        </a>
      </div>
      <!-- Optional: remove this line if there is no browser/web version -->
      <p class="get-alt"><a href="__PLAY_BROWSER_URL__">▶ Or play in your browser</a></p>
      <p class="get-note">Free · no ads · works offline</p>
    </div>
  </main>
</body>
</html>
